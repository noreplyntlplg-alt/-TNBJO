/* ============================================================
   50. ANIMATIONS
   ============================================================ */

.fade-in {
    animation:
        fadeIn 0.25s ease;
}

.slide-up {
    animation:
        slideUp 0.25s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        opacity: 0;

        transform:
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

/* ============================================================
   51. PRINT PREVIEW
   ============================================================ */

.print-preview-container {
    background:
        #e9ecef;

    padding: 30px;

    min-height: 500px;

    overflow: auto;
}

.print-preview-paper {
    width: 210mm;

    min-height: 297mm;

    margin: 0 auto;

    padding: 20mm;

    background: #ffffff;

    color: #000000;

    box-shadow:
        0 2px 15px rgba(0, 0, 0, 0.12);

    font-family:
        "TH Sarabun New",
        "TH Sarabun",
        sans-serif;

    font-size: 18px;
}

.print-preview-paper.landscape {
    width: 297mm;

    min-height: 210mm;
}

/* ============================================================
   52. OFFICIAL DOCUMENT A4
   ============================================================ */

.official-document {
    width: 210mm;

    min-height: 297mm;

    margin: 0 auto;

    padding:
        20mm
        20mm
        18mm
        25mm;

    background: #ffffff;

    color: #000000;

    font-family:
        "TH Sarabun New",
        "TH Sarabun",
        sans-serif;

    font-size: 16pt;

    line-height: 1.35;
}

.official-header {
    text-align: center;

    margin-bottom: 10mm;
}

.official-logo {
    width: 25mm;
    height: 25mm;

    margin: 0 auto 4mm;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 22pt;
}

.official-title {
    font-size: 20pt;

    font-weight: 700;

    margin: 0;
}

.official-subtitle {
    font-size: 16pt;

    margin-top: 2mm;
}

.official-meta {
    display: flex;

    justify-content: space-between;

    margin-bottom: 8mm;

    font-size: 15pt;
}

.official-table {
    width: 100%;

    border-collapse: collapse;
}

.official-table th,
.official-table td {
    border:
        0.3mm solid #000000;

    padding:
        2.5mm
        3mm;

    vertical-align: top;
}

.official-table th {
    text-align: center;

    font-weight: 700;
}

.official-total {
    font-weight: 700;

    text-align: right;
}

.official-signature-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15mm;

    margin-top: 25mm;
}

.official-signature {
    text-align: center;

    min-height: 30mm;
}

.official-signature-line {
    border-bottom:
        0.3mm solid #000000;

    margin:
        15mm 8mm 3mm;
}

.official-note {
    margin-top: 8mm;

    font-size: 14pt;
}

/* ============================================================
   53. 80MM RECEIPT
   ============================================================ */

.receipt-80mm {
    width: 80mm;

    max-width: 80mm;

    margin: 0 auto;

    padding:
        3mm
        3mm
        5mm;

    background: #ffffff;

    color: #000000;

    font-family:
        "TH Sarabun New",
        "TH Sarabun",
        sans-serif;

    font-size: 14pt;

    line-height: 1.2;
}

.receipt-header {
    text-align: center;

    margin-bottom: 3mm;
}

.receipt-logo {
    width: 15mm;
    height: 15mm;

    margin: 0 auto 2mm;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15pt;
}

.receipt-title {
    margin: 0;

    font-size: 18pt;

    font-weight: 700;
}

.receipt-subtitle {
    font-size: 13pt;
}

.receipt-divider {
    border-top:
        0.3mm dashed #000000;

    margin:
        2.5mm
        0;
}

.receipt-row {
    display: flex;

    justify-content: space-between;

    gap: 3mm;

    margin-bottom: 1.5mm;
}

.receipt-label {
    flex: 0 0 auto;
}

.receipt-value {
    text-align: right;

    word-break: break-word;
}

.receipt-item {
    margin-bottom: 2mm;
}

.receipt-item-name {
    font-weight: 700;
}

.receipt-item-detail {
    display: flex;

    justify-content: space-between;

    gap: 3mm;
}

.receipt-total {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 3mm;

    margin-top: 2mm;

    padding-top: 2mm;

    border-top:
        0.5mm solid #000000;

    font-size: 16pt;

    font-weight: 700;
}

.receipt-footer {
    margin-top: 5mm;

    text-align: center;

    font-size: 12pt;
}

/* ============================================================
   54. 80MM PRINTER CSS
   ============================================================ */

.printer-80mm-print {
    width: 80mm;

    max-width: 80mm;

    margin: 0;

    padding: 0;

    background: #ffffff;

    color: #000000;
}

/* ============================================================
   55. RESPONSIVE - LARGE DESKTOP
   ============================================================ */

@media (max-width: 1400px) {

    .dashboard-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

    .report-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

    .filter-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}

/* ============================================================
   56. RESPONSIVE - DESKTOP
   ============================================================ */

@media (max-width: 1200px) {

    :root {
        --sidebar-width: 245px;
    }

    .dashboard-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .dashboard-columns {
        grid-template-columns:
            minmax(0, 1fr);
    }

    .report-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .filter-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .settings-layout {
        grid-template-columns:
            210px minmax(0, 1fr);
    }
}

/* ============================================================
   57. RESPONSIVE - TABLET
   ============================================================ */

@media (max-width: 992px) {

    body {
        font-size: 19px;
    }

    .sidebar {
        transform:
            translateX(-100%);

        box-shadow:
            5px 0 20px rgba(0, 0, 0, 0.18);
    }

    .sidebar.mobile-open {
        transform:
            translateX(0);
    }

    .main-wrapper {
        margin-left: 0 !important;
    }

    .sidebar-overlay {
        display: none;
    }

    .sidebar-overlay.show {
        display: block;
    }

    .sidebar-toggle {
        display: flex;
    }

    .main-content {
        padding: 18px;
    }

    .form-row {
        gap: 11px;
    }

    .settings-layout {
        grid-template-columns:
            1fr;
    }

    .settings-menu {
        display: flex;

        overflow-x: auto;

        gap: 3px;
    }

    .settings-menu-item {
        width: auto;

        min-width: max-content;
    }

    .info-grid {
        grid-template-columns:
            1fr;
    }

    .info-item:nth-child(odd) {
        border-right: 0;
    }

    .info-item:nth-last-child(-n + 2) {
        border-bottom:
            1px solid var(--border);
    }

    .info-item:last-child {
        border-bottom: 0;
    }
}

/* ============================================================
   58. RESPONSIVE - MOBILE
   ============================================================ */

@media (max-width: 768px) {

    :root {
        --topbar-height: 60px;
    }

    body {
        font-size: 18px;
    }

    .topbar {
        height: var(--topbar-height);

        padding:
            0 10px;
    }

    .page-title {
        font-size: 22px;
    }

    .page-breadcrumb {
        display: none;
    }

    .topbar-user-info {
        display: none;
    }

    .topbar-action {
        width: 38px;
        height: 38px;
    }

    .topbar-avatar {
        width: 35px;
        height: 35px;
    }

    .main-content {
        padding: 12px;
    }

    .content-header {
        align-items: flex-start;

        flex-direction: column;

        margin-bottom: 13px;
    }

    .content-header-right {
        width: 100%;

        justify-content: flex-start;
    }

    .content-title {
        font-size: 25px;
    }

    .content-description {
        font-size: 16px;
    }

    .dashboard-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 9px;
    }

    .stat-card {
        min-height: 115px;

        padding: 13px;
    }

    .stat-icon {
        width: 40px;
        height: 40px;

        font-size: 18px;
    }

    .stat-label {
        margin-top: 9px;

        font-size: 16px;
    }

    .stat-value {
        font-size: 25px;
    }

    .dashboard-columns {
        gap: 12px;
    }

    .quick-actions {
        grid-template-columns:
            1fr;
    }

    .toolbar {
        align-items: stretch;

        flex-direction: column;
    }

    .toolbar-left,
    .toolbar-right {
        width: 100%;

        justify-content: flex-start;
    }

    .search-box {
        width: 100%;

        min-width: 0;
    }

    .filter-grid {
        grid-template-columns:
            1fr;
    }

    .form-row {
        grid-template-columns:
            1fr;
    }

    .col-1,
    .col-2,
    .col-3,
    .col-4,
    .col-5,
    .col-6,
    .col-7,
    .col-8,
    .col-9,
    .col-10,
    .col-11,
    .col-12 {
        grid-column: span 1;
    }

    .payment-method-grid {
        grid-template-columns:
            1fr;
    }

    .status-summary-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .report-grid {
        grid-template-columns:
            1fr;
    }

    .modal-overlay {
        padding: 8px;
    }

    .modal {
        max-height:
            calc(100vh - 16px);

        border-radius: 8px;
    }

    .modal-header {
        padding:
            9px 12px;
    }

    .modal-body {
        padding:
            13px;
    }

    .modal-footer {
        padding:
            9px 12px;
    }

    .modal-footer .btn {
        flex: 1;

        min-width: 120px;
    }

    .document-section {
        padding:
            13px;
    }

    .check-preview {
        padding: 15px;

        min-width: 650px;
    }

    .print-preview-container {
        padding: 10px;
    }

    .print-preview-paper {
        transform-origin:
            top center;
    }

    .app-footer {
        padding:
            10px 12px;

        font-size: 14px;
    }
}

/* ============================================================
   59. RESPONSIVE - SMALL MOBILE
   ============================================================ */

@media (max-width: 480px) {

    .login-page {
        padding: 13px;
    }

    .login-card {
        padding:
            25px 20px;
    }

    .login-logo {
        width: 70px;
        height: 70px;

        font-size: 32px;
    }

    .login-title {
        font-size: 27px;
    }

    .login-subtitle {
        font-size: 18px;
    }

    .dashboard-grid {
        grid-template-columns:
            1fr 1fr;

        gap: 7px;
    }

    .stat-card {
        padding: 10px;

        min-height: 105px;
    }

    .stat-icon {
        width: 34px;
        height: 34px;

        font-size: 16px;
    }

    .stat-label {
        font-size: 14px;
    }

    .stat-value {
        font-size: 22px;
    }

    .btn {
        font-size: 17px;
    }

    .btn-lg {
        font-size: 18px;
    }

    .card-header {
        padding:
            11px 12px;
    }

    .card-body {
        padding:
            12px;
    }

    .card-header-title {
        font-size: 20px;
    }

    .form-label {
        font-size: 17px;
    }

    .form-control {
        min-height: 40px;

        font-size: 17px;
    }

    .info-item {
        grid-template-columns:
            1fr;

        gap: 0;

        min-height: auto;

        padding: 7px 10px;
    }

    .info-value {
        margin-top: 2px;
    }

    .status-summary-grid {
        gap: 7px;
    }

    .status-summary {
        padding: 9px;
    }

    .status-summary-value {
        font-size: 22px;
    }

    .topbar-right {
        gap: 2px;
    }

    .sidebar-toggle {
        margin-right: 5px;
    }
}

/* ============================================================
   60. PRINT GENERAL
   ============================================================ */

@media print {

    html,
    body {
        width: 100%;

        margin: 0 !important;
        padding: 0 !important;

        background: #ffffff !important;

        color: #000000 !important;
    }

    body * {
        visibility: hidden;
    }

    .print-area,
    .print-area * {
        visibility: visible;
    }

    .print-area {
        position: absolute;

        left: 0;
        top: 0;

        width: 100%;

        margin: 0;

        padding: 0;
    }

    .no-print,
    .sidebar,
    .topbar,
    .app-footer,
    .modal-overlay,
    .loading-overlay {
        display: none !important;
    }

    .card,
    .document-form,
    .official-document,
    .print-preview-paper {
        box-shadow: none !important;

        border: 0 !important;
    }
}

/* ============================================================
   61. PRINT A4
   ============================================================ */

@media print {

    @page {
        size: A4 portrait;

        margin: 0;
    }

    .print-a4 {
        width: 210mm;

        min-height: 297mm;

        margin: 0;

        padding:
            20mm
            20mm
            18mm
            25mm;
    }
}

/* ============================================================
   62. PRINT 80MM
   ============================================================ */

@media print {

    @page {
        size: 80mm auto;

        margin: 0;
    }

    body.print-80mm {
        width: 80mm;

        min-width: 80mm;

        max-width: 80mm;
    }

    body.print-80mm .print-area {
        width: 80mm;

        max-width: 80mm;

        margin: 0;

        padding: 0;
    }

    body.print-80mm .receipt-80mm {
        width: 80mm;

        max-width: 80mm;

        margin: 0;

        padding:
            3mm
            3mm
            5mm;
    }
}

/* ============================================================
   63. DARK MODE SUPPORT
   ============================================================ */

[data-theme="dark"] {
    --background: #151a20;

    --surface: #1d232b;

    --white: #ffffff;

    --gray-50: #20262e;
    --gray-100: #252c34;
    --gray-200: #303842;
    --gray-300: #3a444f;
    --gray-400: #4a5561;
    --gray-500: #687482;
    --gray-600: #9aa5b1;
    --gray-700: #c1c8cf;
    --gray-800: #e1e5e8;
    --gray-900: #f4f6f8;

    --text: #e8ecef;

    --border: #36404a;
    --border-dark: #48535e;
}

[data-theme="dark"] body {
    background: var(--background);

    color: var(--text);
}

[data-theme="dark"] .topbar,
[data-theme="dark"] .card,
[data-theme="dark"] .stat-card,
[data-theme="dark"] .modal,
[data-theme="dark"] .dropdown-menu,
[data-theme="dark"] .settings-menu,
[data-theme="dark"] .report-card,
[data-theme="dark"] .quick-action,
[data-theme="dark"] .document-form,
[data-theme="dark"] .check-preview {
    background: var(--surface);

    color: var(--text);
}

[data-theme="dark"] .form-control {
    background: #20262e;

    color: var(--gray-900);

    border-color: var(--border-dark);
}

[data-theme="dark"] .form-control:disabled,
[data-theme="dark"] .form-control[readonly] {
    background: #181d23;
}

[data-theme="dark"] .data-table thead th {
    background: #252c34;
}

[data-theme="dark"] .data-table tbody td {
    border-color: var(--border);
}

[data-theme="dark"] .card-footer,
[data-theme="dark"] .modal-footer,
[data-theme="dark"] .pagination,
[data-theme="dark"] .filter-panel,
[data-theme="dark"] .amount-summary {
    background: #20262e;
}

[data-theme="dark"] .topbar-action:hover,
[data-theme="dark"] .sidebar-toggle:hover,
[data-theme="dark"] .dropdown-item:hover,
[data-theme="dark"] .settings-menu-item:hover {
    background: #2a323b;
}

[data-theme="dark"] .page-title,
[data-theme="dark"] .content-title,
[data-theme="dark"] .card-header-title,
[data-theme="dark"] .stat-value,
[data-theme="dark"] .form-label {
    color: var(--gray-900);
}

[data-theme="dark"] .print-preview-container {
    background: #0f1317;
}

/* ============================================================
   64. ACCESSIBILITY
   ============================================================ */

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline:
        3px solid rgba(13, 110, 253, 0.35);

    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;

        scroll-behavior:
            auto !important;
    }
}

/* ============================================================
   65. Z-INDEX HELPERS
   ============================================================ */

.z-100 {
    z-index: 100 !important;
}

.z-500 {
    z-index: 500 !important;
}

.z-1000 {
    z-index: 1000 !important;
}

.z-2000 {
    z-index: 2000 !important;
}

.z-9999 {
    z-index: 9999 !important;
}

/* ============================================================
   66. DOCUMENT ACTION BAR
   ============================================================ */

.document-action-bar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 12px 15px;

    background:
        var(--gray-50);

    border:
        1px solid var(--border);

    border-radius: 7px;

    margin-bottom: 15px;

    flex-wrap: wrap;
}

.document-action-left,
.document-action-right {
    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
}

/* ============================================================
   67. RECORD DETAIL
   ============================================================ */

.record-detail {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        320px;

    gap: 18px;
}

.record-detail-main,
.record-detail-side {
    min-width: 0;
}

.record-detail-side .card {
    margin-bottom: 15px;
}

.record-detail-side .card:last-child {
    margin-bottom: 0;
}

/* ============================================================
   68. FORM SECTION CARD
   ============================================================ */

.form-section-card {
    margin-bottom: 15px;

    background: var(--white);

    border:
        1px solid var(--border);

    border-radius: 8px;

    overflow: hidden;
}

.form-section-card:last-child {
    margin-bottom: 0;
}

.form-section-header {
    padding:
        10px 14px;

    display: flex;

    align-items: center;

    gap: 8px;

    background:
        var(--gray-50);

    border-bottom:
        1px solid var(--border);

    color: var(--primary);

    font-size: 21px;

    font-weight: 700;
}

.form-section-body {
    padding:
        15px;
}

/* ============================================================
   69. NUMBERING PREVIEW
   ============================================================ */

.numbering-preview {
    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        var(--gray-50);

    border:
        1px dashed var(--border-dark);

    border-radius: 7px;
}

.numbering-preview-value {
    padding:
        10px 20px;

    border:
        1px solid var(--border-dark);

    border-radius: 6px;

    background:
        var(--white);

    color:
        var(--primary);

    font-size: 27px;

    font-weight: 700;

    letter-spacing: 1px;
}

/* ============================================================
   70. BANK ACCOUNT CARD
   ============================================================ */

.bank-card {
    padding: 15px;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background: var(--white);

    transition: var(--transition);
}

.bank-card:hover {
    border-color:
        var(--primary);

    box-shadow:
        var(--shadow);
}

.bank-card-header {
    display: flex;

    align-items: center;

    gap: 10px;
}

.bank-icon {
    width: 45px;
    height: 45px;

    border-radius: 8px;

    background:
        rgba(18, 60, 105, 0.09);

    color:
        var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;
}

.bank-name {
    font-size: 21px;

    font-weight: 700;
}

.bank-branch {
    color:
        var(--gray-600);

    font-size: 16px;
}

.bank-account-number {
    margin-top: 12px;

    font-size: 24px;

    font-weight: 700;

    letter-spacing: 1px;

    font-variant-numeric:
        tabular-nums;
}

.bank-account-name {
    margin-top: 2px;

    color:
        var(--gray-600);

    font-size: 17px;
}

/* ============================================================
   71. PAYEE CARD
   ============================================================ */

.payee-card {
    padding: 15px;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background:
        var(--white);
}

.payee-header {
    display: flex;

    align-items: center;

    gap: 10px;
}

.payee-avatar {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        rgba(18, 60, 105, 0.1);

    color:
        var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;
}

.payee-name {
    font-size: 21px;

    font-weight: 700;
}

.payee-type {
    color:
        var(--gray-600);

    font-size: 15px;
}

.payee-info {
    margin-top: 11px;

    padding-top: 10px;

    border-top:
        1px solid var(--border);

    color:
        var(--gray-700);

    font-size: 17px;
}

/* ============================================================
   72. NOTIFICATION PANEL
   ============================================================ */

.notification-panel {
    width: 360px;

    max-width:
        calc(100vw - 20px);

    max-height: 480px;

    overflow-y: auto;

    padding: 0;
}

.notification-header {
    padding:
        12px 14px;

    border-bottom:
        1px solid var(--border);

    font-size: 20px;

    font-weight: 700;
}

.notification-item {
    display: flex;

    align-items: flex-start;

    gap: 10px;

    padding:
        11px 14px;

    border-bottom:
        1px solid var(--gray-200);

    transition: var(--transition);
}

.notification-item:hover {
    background:
        var(--gray-50);
}

.notification-item.unread {
    background:
        rgba(18, 60, 105, 0.035);
}

.notification-icon {
    width: 35px;
    height: 35px;

    flex: 0 0 35px;

    border-radius: 50%;

    background:
        rgba(18, 60, 105, 0.09);

    color:
        var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;
}

.notification-content {
    min-width: 0;
}

.notification-title {
    font-size: 17px;

    font-weight: 700;
}

.notification-message {
    color:
        var(--gray-600);

    font-size: 15px;
}

.notification-time {
    color:
        var(--gray-500);

    font-size: 13px;

    margin-top: 2px;
}

/* ============================================================
   73. API STATUS
   ============================================================ */

.api-status {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    font-size: 15px;
}

.api-status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        var(--gray-400);
}

.api-status.connected
.api-status-dot {
    background:
        var(--success);
}

.api-status.error
.api-status-dot {
    background:
        var(--danger);
}

.api-status.loading
.api-status-dot {
    background:
        var(--warning);

    animation:
        pulse 1s infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}

/* ============================================================
   74. RESPONSIVE RECORD DETAIL
   ============================================================ */

@media (max-width: 1000px) {

    .record-detail {
        grid-template-columns:
            1fr;
    }
}

/* ============================================================
   75. PRINT FORM VISIBILITY
   ============================================================ */

.print-only {
    display: none !important;
}

.screen-only {
    display: block !important;
}

@media print {

    .print-only {
        display: block !important;
    }

    .screen-only {
        display: none !important;
    }
}

/* ============================================================
   76. PRINT SAFE TABLE
   ============================================================ */

.print-table {
    width: 100%;

    border-collapse: collapse;

    color: #000000;
}

.print-table th,
.print-table td {
    border:
        0.3mm solid #000000;

    padding:
        2mm;

    font-family:
        "TH Sarabun New",
        "TH Sarabun",
        sans-serif;

    font-size: 14pt;
}

.print-table th {
    font-weight: 700;

    text-align: center;
}

/* ============================================================
   77. NO DATA
   ============================================================ */

.no-data {
    min-height: 180px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color:
        var(--gray-500);

    text-align: center;
}

.no-data i {
    font-size: 36px;

    margin-bottom: 8px;
}

.no-data-title {
    font-size: 20px;

    font-weight: 700;

    color:
        var(--gray-600);
}

.no-data-description {
    font-size: 16px;
}

/* ============================================================
   78. ERROR STATE
   ============================================================ */

.error-state {
    padding: 30px;

    text-align: center;

    border:
        1px solid rgba(220, 53, 69, 0.25);

    background:
        rgba(220, 53, 69, 0.04);

    border-radius: 8px;

    color:
        var(--danger);
}

.error-state-icon {
    font-size: 35px;

    margin-bottom: 8px;
}

.error-state-title {
    font-size: 21px;

    font-weight: 700;
}

.error-state-description {
    margin-top: 4px;

    color:
        var(--gray-600);

    font-size: 16px;
}

/* ============================================================
   79. MOBILE TABLE CARD MODE
   ============================================================ */

@media (max-width: 600px) {

    .mobile-card-table {
        min-width: 0;
    }

    .mobile-card-table thead {
        display: none;
    }

    .mobile-card-table tbody,
    .mobile-card-table tr,
    .mobile-card-table td {
        display: block;

        width: 100%;
    }

    .mobile-card-table tbody tr {
        margin-bottom: 10px;

        padding: 10px;

        border:
            1px solid var(--border);

        border-radius: 7px;

        background:
            var(--white);
    }

    .mobile-card-table tbody td {
        padding:
            4px 0;

        border: 0;

        display: flex;

        align-items: flex-start;

        justify-content: space-between;

        gap: 10px;

        text-align: right;
    }

    .mobile-card-table tbody td::before {
        content: attr(data-label);

        flex: 0 0 42%;

        text-align: left;

        color:
            var(--gray-600);

        font-weight: 700;
    }

    .mobile-card-table .table-actions {
        justify-content: flex-end;
    }
}
